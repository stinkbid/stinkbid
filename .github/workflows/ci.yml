name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
      - name: Fork tests against Robinhood Chain
        run: forge test --match-contract Fork -vv
        env:
          FORK_RPC: https://robinhood.drpc.org

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
