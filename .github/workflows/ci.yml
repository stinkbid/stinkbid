name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
      - name: Fork tests against Robinhood Chain
        run: forge test --match-contract Fork -vv
        env:
          FORK_RPC: https://robinhood.drpc.org

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - name: Slither (see contracts/ANALYSIS.md)
        working-directory: contracts
        run: slither . --config-file slither.config.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan, full history (config in .gitleaks.toml)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (shared config, order API validation)
        run: npm test
      - run: npm run build
