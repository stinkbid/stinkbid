name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
      - name: Fork tests against Robinhood Chain
        run: forge test --match-contract Fork -vv
        env:
          FORK_RPC: https://robinhood.drpc.org

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - name: Slither (see contracts/ANALYSIS.md)
        working-directory: contracts
        run: slither . --config-file slither.config.json

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
