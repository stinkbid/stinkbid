name: Bug
description: Something on stinkbid.pro, the API or the keeper does not work as documented.
body:
  - type: markdown
    attributes:
      value: For a security issue, use private reporting under Security → Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Include the order id or transaction hash if there is one.
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Wallet and browser
      placeholder: e.g. MetaMask 13 on Chrome
