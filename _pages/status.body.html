<!-- desc: Live state of the StinkBid contract and the keeper on Robinhood Chain. -->

      <section class="page" aria-labelledby="st-title">
        <div class="page-head">
          <p class="kicker"><span class="tick" aria-hidden="true"></span>Live · refreshes every 15 seconds</p>
          <h1 id="st-title">Status</h1>
          <p>Read from the chain and from the keeper's own run log. Nothing on this page is typed in by hand.</p>
        </div>
        <div class="tiles" id="tiles">
          <div class="tile wide"><div class="k">Contract</div><div class="v" id="t-contract">–</div><div class="s" id="t-contract-s"></div></div>
          <div class="tile wide"><div class="k">Keeper</div><div class="v" id="t-keeper">–</div><div class="s" id="t-keeper-s"></div></div>
          <div class="tile wide"><div class="k">Chain head</div><div class="v" id="t-block">–</div><div class="s" id="t-block-s"></div></div>
          <div class="tile"><div class="k">Open bids</div><div class="v" id="t-open">–</div><div class="s">signed, waiting</div></div>
          <div class="tile"><div class="k">Fills, 24 hours</div><div class="v" id="t-fills">–</div><div class="s" id="t-fills-s"></div></div>
          <div class="tile"><div class="k">Runs, last hour</div><div class="v" id="t-runs">–</div><div class="s" id="t-runs-s"></div></div>
          <div class="tile"><div class="k">Last error</div><div class="v" id="t-err">–</div><div class="s" id="t-err-s"></div></div>
        </div>
        <div class="refresh" aria-hidden="true"><span id="t-bar"></span></div>
        <p class="slip-help" id="t-updated" style="margin-top:18px"></p>
      </section>
